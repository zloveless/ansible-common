---
- name: Check if docker is installed
  ansible.builtin.command: docker -v
  register: docker_check
  ignore_errors: true
  changed_when: false

- name: Fail if docker is not installed
  ansible.builtin.fail:
    msg: "Docker and Docker Compose need to be installed before using this role."
  when: docker_check.rc != 0

- name: Set project_path fact
  ansible.builtin.set_fact:
    project_path: "{{ compose_project_base_path }}/{{ project_name }}"

- name: Install the project service
  ansible.builtin.include_tasks: install.yaml
  when: state | default('present') == 'present'

- name: Uninstall the project service
  ansible.builtin.include_tasks: uninstall.yaml
  when: state | default('present') == 'absent'
